[mod]
id = "spidey-socket"
version = "0.2.1"
priority = 100

[compatibility]
horizon_revision = "e0c615b64365eb69e7508501b903bee374982b7d"

[[module]]
id = "view-turn"
file = "crates/horizon-client-render/src/camera.rs"
name = "spider_man_view"
source = "view_turn.rs"
visibility = "pub"

[[module]]
id = "socket"
file = "crates/horizon-client/src/game.rs"
name = "spidey_socket"
source = "socket.rs"

[[module]]
id = "fall-gate"
file = "crates/horizon-client/src/motion.rs"
name = "spider_man_fall"
source = "fall_gate.rs"
visibility = "pub"

[[injection]]
id = "before-level-tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "before-send-state"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_send_state"
helper = "send_state.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "after-send-state"
kind = "HEAD"
# remote_send_state's own RETURN can't be hooked (a nested item in its body): the
# next thing tick_remote runs after the state packet is tick_own_rockets.
target = "horizon_client::game::remote_projectiles::Game<'_>::tick_own_rockets"
helper = "send_state_end.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "server-turn"
kind = "HEAD"
target = "horizon_client::game::lan_actions::Game<'_>::guest_server_tick"
helper = "server_turn.rs"
bindings = [
  { name = "host", ty = "&crate::game::lan::LanHost", value = "&*host" },
  { name = "conn", ty = "u32", value = "conn" },
]

[[injection]]
id = "web-forgets-fall"
kind = "HEAD"
target = "horizon_client::motion::<MotionWorld<'_,'_,'_> as EntityMoveWorld>::check_fall_damage"
helper = "fall.rs"
bindings = [
  { name = "w", ty = "&mut crate::motion::MotionWorld<'_, '_, '_>", value = "&mut *self" },
  { name = "dy", ty = "f64", value = "dy" },
]

[[injection]]
id = "plug-ropes"
kind = "HEAD"
target = "horizon_client::game::leads::Game<'_>::leash_geometry"
helper = "ropes.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "posed-player"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::player_model_geometry"
helper = "model.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "plug-camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "partial", ty = "f32", value = "partial" },
]

[[injection]]
id = "turned-view"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::camera::view_matrix"
helper = "view.rs"
bindings = [
  { name = "yaw", ty = "f32", value = "yaw" },
  { name = "pitch", ty = "f32", value = "pitch" },
]

# Horizon's native hook points (stable across releases): commands, the mod's
# row and settings page in Options > Mods, its keys, the camera shake.
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "listed"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "listed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "camera-shake"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_camera_shake"
helper = "shake.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "shake", ty = "&mut crate::game::native_hooks::NativeShake", value = "&mut *shake" },
]
