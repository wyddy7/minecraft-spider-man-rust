[mod]
id = "spider-man"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "506a9c8f0184d1eff992b937aac364bb2c461f41"

[[module]]
id = "socket"
file = "crates/horizon-client/src/game.rs"
name = "spider_man"
source = "spider_man.rs"

[[injection]]
id = "before-level-tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "before-send-state"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_send_state"
helper = "send_state.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "after-send-state"
kind = "RETURN"
target = "horizon_client::game::remote::Game<'_>::remote_send_state"
helper = "send_state_end.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "plug-command"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::chat::Game<'_>::handle_chat_input"
helper = "chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]

[[injection]]
id = "plug-ropes"
kind = "HEAD"
target = "horizon_client::game::leads::Game<'_>::leash_geometry"
helper = "ropes.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "posed-player"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::player_model_geometry"
helper = "model.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "plug-camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "partial", ty = "f32", value = "partial" },
]

[[injection]]
id = "plug-command-sent"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::send_chat"
helper = "chat_sent.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]
