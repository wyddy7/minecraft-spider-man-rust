[mod]
id = "spider_man"
version = "0.2.5"
priority = 100

[compatibility]
horizon_revision = "0b14f8acfd97fa2c750e42795249dcc981178ca4"

[[module]]
id = "socket"
file = "crates/horizon-client/src/game.rs"
name = "spider_man"
source = "spider_man.rs"

[[injection]]
id = "before-level-tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
helper = "tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "before-send-state"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::remote_send_state"
helper = "send_state.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "after-send-state-0"
kind = "AFTER_CALL"
# Right after the state packet (two callers send it): remote_send_state's own
# RETURN can't be hooked (a nested item in its body).
target = "horizon_client::game::remote::Game<'_>::tick_remote_player"
selector = "self.remote_send_state"
result = "()"
require = 1
ordinal = 0
helper = "send_state_end.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "after-send-state-1"
kind = "AFTER_CALL"
target = "horizon_client::game::remote::Game<'_>::tick_local_player"
selector = "self.remote_send_state"
result = "()"
require = 1
ordinal = 0
helper = "send_state_end.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]
[[injection]]
id = "server-turn"
kind = "HEAD"
# The first thing a player's turn on the server does (guest_server_tick itself
# can't be patched: a macro in its body).
target = "horizon_client::game::prediction::Game<'_>::guest_replay"
helper = "server_turn.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "conn", ty = "u32", value = "conn" },
]

[[injection]]
id = "plug-ropes"
kind = "HEAD"
target = "horizon_client::game::leads::Game<'_>::leash_geometry"
helper = "ropes.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "posed-player"
kind = "HEAD"
target = "horizon_client::game::perspective::Game<'_>::player_model_geometry"
helper = "model.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&Vec<horizon_client::mesher::Vertex>", value = "&*out" },
]

[[injection]]
id = "turned-player"
kind = "RETURN"
target = "horizon_client::game::perspective::Game<'_>::player_model_geometry"
helper = "turn.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "plug-camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "partial", ty = "f32", value = "partial" },
]

[[injection]]
id = "turned-view"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::camera::view_matrix"
helper = "view.rs"
bindings = [
  { name = "yaw", ty = "f32", value = "yaw" },
  { name = "pitch", ty = "f32", value = "pitch" },
]

# Horizon's native hook points (stable across releases): commands, the mod's
# row and settings page in Options > Mods, its keys, the camera shake.
[[injection]]
id = "camera-shake"
kind = "HEAD"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_camera_shake"
helper = "shake.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "shake", ty = "&mut mod_api::Shake", value = "&mut *shake" },
]
